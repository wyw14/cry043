services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: spec, POSTGRES_PASSWORD: spec, POSTGRES_DB: spec}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U spec"], interval: 3s, timeout: 3s, retries: 20}
    volumes: ["spec-db:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d:ro"]
  app:
    build: .
    environment: {HTTP_ADDR: ":8080", DATABASE_URL: "postgres://spec:spec@postgres:5432/spec?sslmode=disable", UPLOAD_DIR: "/evidence"}
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}
    volumes: ["evidence:/evidence"]
volumes: {spec-db: {}, evidence: {}}
